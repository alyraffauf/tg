[project]
name = "tgmcp"
version = "0.10.0"
description = "A typed MCP server for the tg Tangled client"
readme = "README.md"
authors = [
    { name = "Aly Raffauf", email = "aly@aly.codes" }
]
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=4.2.0",
    "pydantic>=2.14.3",
    "ruff>=0.17.5",
    "ty>=0.0.104",
]

[project.scripts]
tgmcp = "tgmcp:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]
