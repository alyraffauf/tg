when:
  - event: ["push", "manual"]
    branch: ["master"]
  - event: ["pull_request"]
    branch: ["master"]

engine: "nixery"

dependencies:
  nixpkgs:
    - nix

steps:
  - name: "Check formatting"
    command: "nix --extra-experimental-features 'nix-command flakes' fmt -- --ci"
  - name: "Build tg"
    command: "nix --extra-experimental-features 'nix-command flakes' build .#tg"
