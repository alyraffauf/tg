when:
  - event: ["push", "pull_request"]
    branch: ["master"]

engine: "nixery"

dependencies:
  # go.mod requires Go 1.26+; unstable tracks the latest Go release.
  nixpkgs/nixpkgs-unstable:
    - go
    - gcc

steps:
  - name: "Run tests"
    command: "go test -race ./..."
  - name: "Check generated lexicons"
    command: |
      go generate ./internal/tangledlex
      git diff --exit-code -- internal/tangledlex
